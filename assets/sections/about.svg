<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Identity card. Name: Vishal Raj Purohit. Role: Software Developer. Location: Bengaluru, India. Education: MCA, Presidency University, CGPA 9.23. Domains: AI/ML, Full-Stack, Cybersecurity, Data Science. Status: open to opportunities.">
  <defs>
    <linearGradient id="a_panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#06080f"/>
    </linearGradient>
    <linearGradient id="a_border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/><stop offset="0.5" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="a_mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="a_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10344a"/><stop offset="1" stop-color="#06080f"/>
    </radialGradient>
    <pattern id="a_grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#101d33" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="4" y="4" width="1192" height="292" rx="16" fill="url(#a_border)"/>
  <rect x="6" y="6" width="1188" height="288" rx="14" fill="url(#a_panel)"/>
  <rect x="6" y="6" width="1188" height="288" rx="14" fill="url(#a_grid)" opacity="0.5"/>

  <!-- LEFT: avatar badge -->
  <g transform="translate(190,150)">
    <circle r="150" fill="url(#a_glow)" opacity="0.7"/>
    <circle r="96" fill="none" stroke="#1c3b52" stroke-width="1"/>
    <circle r="96" fill="none" stroke="url(#a_mono)" stroke-width="2" stroke-dasharray="40 260" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <!-- hexagon -->
    <path d="M0 -74 L64 -37 L64 37 L0 74 L-64 37 L-64 -37 Z" fill="#0b1626" stroke="#22d3ee" stroke-width="2"/>
    <text x="0" y="22" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="62" font-weight="800" fill="url(#a_mono)">VP</text>
    <!-- scan line across hexagon -->
    <rect x="-64" y="-6" width="128" height="3" fill="#22d3ee" opacity="0.6">
      <animate attributeName="y" values="-70;70;-70" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="126" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="12" fill="#5f7fa6" letter-spacing="2">ID · DEV-8585</text>
  </g>

  <line x1="370" y1="52" x2="370" y2="248" stroke="#17263f" stroke-width="1"/>

  <!-- RIGHT: fields -->
  <g font-family="'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace">
    <g transform="translate(420,74)">
      <g><rect x="0" y="-14" width="6" height="6" fill="#22d3ee"/><text x="20" y="-9" font-size="12.5" fill="#5f7fa6" letter-spacing="1">NAME</text><text x="20" y="16" font-size="20" font-weight="700" fill="#e2e8f0" font-family="'Segoe UI',system-ui,sans-serif">Vishal Raj Purohit</text></g>
      <g transform="translate(0,56)"><rect x="0" y="-14" width="6" height="6" fill="#8b5cf6"/><text x="20" y="-9" font-size="12.5" fill="#5f7fa6" letter-spacing="1">ROLE</text><text x="20" y="16" font-size="18" fill="#cbd5e1" font-family="'Segoe UI',system-ui,sans-serif">Software Developer</text></g>
      <g transform="translate(0,112)"><rect x="0" y="-14" width="6" height="6" fill="#22c55e"/><text x="20" y="-9" font-size="12.5" fill="#5f7fa6" letter-spacing="1">LOCATION</text><text x="20" y="16" font-size="18" fill="#cbd5e1" font-family="'Segoe UI',system-ui,sans-serif">Bengaluru, India</text></g>
    </g>
    <g transform="translate(800,74)">
      <g><rect x="0" y="-14" width="6" height="6" fill="#22d3ee"/><text x="20" y="-9" font-size="12.5" fill="#5f7fa6" letter-spacing="1">EDUCATION</text><text x="20" y="16" font-size="18" fill="#cbd5e1" font-family="'Segoe UI',system-ui,sans-serif">MCA · Presidency Univ.</text><text x="20" y="38" font-size="13" fill="#7dd3fc">CGPA 9.23</text></g>
      <g transform="translate(0,90)"><rect x="0" y="-14" width="6" height="6" fill="#8b5cf6"/><text x="20" y="-9" font-size="12.5" fill="#5f7fa6" letter-spacing="1">DOMAINS</text><text x="20" y="16" font-size="14.5" fill="#c4b5fd" font-family="'Segoe UI',system-ui,sans-serif">AI/ML · Full-Stack</text><text x="20" y="38" font-size="14.5" fill="#c4b5fd" font-family="'Segoe UI',system-ui,sans-serif">Cybersecurity · Data Science</text></g>
    </g>
    <!-- status chip -->
    <g transform="translate(420,246)">
      <rect x="0" y="0" width="190" height="30" rx="15" fill="#0c1830" stroke="#1a5a3a"/>
      <circle cx="18" cy="15" r="5" fill="#22c55e"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="32" y="20" font-size="13" fill="#7fe0b0">open to opportunities</text>
    </g>
  </g>
  <path d="M28 28 h34 M28 28 v34" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M1172 272 h-34 M1172 272 v-34" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.7"/>
</svg>
